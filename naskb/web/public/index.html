<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NASKB 知识库系统</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app"></div>
<!-- 运行时零构建：以 import map 让裸导入 'vue' 解析到 vendor 的 ESM full build（含 runtime+compiler）。
     app-core.js / app-main.js 均为原生 ESM <script type="module">，无需打包步骤。 -->
<script type="importmap">
{
  "imports": {
    "vue": "./vendor/vue.esm-browser.prod.js"
  }
}
</script>
<script type="module" src="/app-main.js"></script>
</body>
</html>
