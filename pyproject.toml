[project]
name = "naskb"
version = "0.4.0"
description = "NAS Knowledge Base — 智能 NAS 知识库（.naskb 目录描述仓库 + DeepSeek/MiMo AI 分析，Reasonix Skill 形态）"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "fsspec>=2024",
    "numpy>=1.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# WebDAV 支持
webdav = ["webdav4>=0.10"]
# 文档分析（PDF/Word/Excel 提取；老版 .doc/.xls 需 olefile/xlrd/Word COM）
analyze = ["pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "chardet>=5.2",
           "olefile>=0.47", "xlrd>=2.0", "pywin32>=306; platform_system == 'Windows'"]
# LLM 调用框架（DeepSeek 文本 + MiMo 多模态）
llm = ["httpx>=0.27"]
# MinerU 全格式文档解析（PDF/DOCX/PPTX/XLSX → md/html/json；含 torch，需 8G+ 或 CPU）
mineru = ["mineru>=2.0"]
# 媒体分析（图片 EXIF/音频/视频；需要系统安装 ffmpeg）
media = ["pillow>=10.0"]
# 语义向量检索（bge-small-zh ONNX + numpy 余弦；BM25 为内置降级）
vectors = ["onnxruntime>=1.18", "tokenizers>=0.15"]
# PostgreSQL + pgvector 多 NAS 向量库（REQ-R4；可选增强，未装则 PG 功能不可用）
pg = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
# MCP Server（Agent 标准接口；阶段 A stdio，阶段 B streamable HTTP）
mcp = ["mcp>=1.2"]
# 平台服务（v3：FastAPI 常驻服务 + Web UI + 下载代理/预览）
server = ["fastapi>=0.110", "uvicorn>=0.27"]
# 测试
test = ["pytest>=8.0", "pytest-asyncio>=0.21", "httpx>=0.27"]

[project.scripts]
naskb = "naskb.skill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["naskb/scripts"]
